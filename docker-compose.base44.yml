# Base44 dev environment — runs the app from cloned source with live reload.
# Frontend (CRA/craco) on port 3000, proxied to the FastAPI backend (single origin,
# required for the app's httpOnly SameSite=None session cookie). MongoDB is local infra.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: gym
      MONGO_INITDB_ROOT_PASSWORD: gympass
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.base44
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://gym:gympass@mongo:27017/?authSource=admin
      DB_NAME: gym_personal
      PYTHONUNBUFFERED: "1"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    volumes:
      - ./backend:/app
    # Exposed for direct debugging / external webhooks; the frontend proxies to it.
    ports:
      - "8000:8000"

  frontend:
    image: node:22
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BROWSER: "none"
      CI: "false"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Empty -> frontend calls "/api" (relative), proxied to the backend (single origin).
      REACT_APP_BACKEND_URL: ""
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "yarn install && npx craco start"

volumes:
  mongo_data:
  frontend_node_modules:
